apiVersion: 1

providers:
  - name: nvis-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    folder: NVIS
    options:
      path: /etc/grafana/dashboards
      foldersFromFilesStructure: false

  - name: iren_mkz-custom-dashboards
    orgId: 1
    type: file
    disableDeletion: false
    allowUiUpdates: true
    updateIntervalSeconds: 30
    folder: IREN_MKZ
    folderUid: iren_mkz
    options:
      path: /etc/grafana/dashboards-iren_mkz
      foldersFromFilesStructure: false
